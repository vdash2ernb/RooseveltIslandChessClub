<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Look Development · Roosevelt Island Chess Club</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#132029">
<link rel="preload" href="../assets/fonts/bricolage-grotesque/bricolage-grotesque-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/atkinson-hyperlegible/atkinson-hyperlegible-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
:root{
  --canvas:#132029; --panel:#1b2c37e6; --line:#2f4655; --ivory:#f3ebdd; --muted:#a7b5bd; --orange:#ff5b1f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1100px 700px at 50% 38%, #2a4556 0%, transparent 70%),
    radial-gradient(900px 500px at 85% 0%, #ff5b1f1c, transparent 60%),
    linear-gradient(180deg,#16262f 0%,#0f1a21 100%);
  color:var(--ivory);font:16px/1.5 var(--body);overflow:hidden;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;opacity:0;transition:opacity 1.2s ease}
body.ready #scene{opacity:1}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,#0a1217aa 100%)}

header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:16px;align-items:flex-start;pointer-events:none}
header h1{margin:0;font:800 clamp(20px,2.4vw,28px)/1.05 var(--display);letter-spacing:-.01em}
header p{margin:6px 0 0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
header p b{color:var(--orange);font-weight:500}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:12px;justify-items:center;width:min(720px,calc(100% - 32px))}
.shots{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(10px)}
.shots button,.tt{appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--display);padding:11px 16px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
.shots button:hover,.tt:hover{color:var(--ivory)}
.shots button[aria-pressed="true"]{background:var(--ivory);color:#132029}
.tt{border:1px solid var(--line)}
.tt[aria-pressed="true"]{border-color:var(--orange);color:var(--ivory)}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#caption{margin:0;max-width:62ch;text-align:center;color:var(--ivory);font-size:15px;text-wrap:balance;text-shadow:0 1px 12px #0b141a}
@media (pointer:coarse){.shots button,.tt{min-height:44px}}
@media (max-width:520px){.shots button{padding:11px 11px;font-size:13px}#caption{font-size:14px}}

#loader{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .8s ease, visibility .8s;pointer-events:none}
#loader.done{opacity:0;visibility:hidden}
#loader div{display:grid;gap:14px;justify-items:center}
#loader svg{width:40px;height:40px;animation:spin 1.6s linear infinite}
#loader.failed svg{display:none}
#status{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;max-width:36ch;line-height:1.5}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#loader svg{animation:none}#scene{transition:none}}
</style>
<script type="importmap">
{ "imports": {
  "three": "../assets/vendor/three/three.module.min.js",
  "three/addons/": "../assets/vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="scene" aria-label="3D chess board, pieces and club medallion"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header>
  <div>
    <h1>Roosevelt Island Chess Club</h1>
    <p><b>Look development</b> · Phase 1 · for approval</p>
  </div>
</header>

<div id="loader" role="status">
  <div>
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="#2f4655" stroke-width="3"/><path d="M24 4a20 20 0 0 1 20 20" fill="none" stroke="#ff5b1f" stroke-width="3" stroke-linecap="round"/></svg>
    <span id="status">Setting up</span>
  </div>
</div>

<nav class="dock" aria-label="Camera shots">
  <p id="caption"></p>
  <div class="row">
    <div class="shots" role="group" aria-label="Shot">
      <button type="button" data-shot="board" aria-pressed="false">Board</button>
      <button type="button" data-shot="pieces" aria-pressed="false">Pieces</button>
      <button type="button" data-shot="knight" aria-pressed="false">Knight</button>
      <button type="button" data-shot="medallion" aria-pressed="false">Medallion</button>
    </div>
    <button type="button" class="tt" id="turntable" aria-pressed="false">Turntable</button>
  </div>
</nav>

<script type="module" src="../assets/js/lookdev.js"></script>
</body>
</html>
